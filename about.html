  <script>
    (() => {
      let preferredLanguage = navigator.language || "en-US";
      try {
        preferredLanguage = localStorage.getItem("wefortune-language") || preferredLanguage;
      } catch (_) {}
      const directory = preferredLanguage.toLowerCase().startsWith("pt") ? "pt-br" : "en-us";
      window.location.replace(`${directory}/about.html${window.location.search}${window.location.hash}`);
    })();
  </script>
